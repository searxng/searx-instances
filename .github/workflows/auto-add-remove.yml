name: Auto add/remove

on:
  issues:
    types: [labeled]

jobs:
  apply:
    if: github.event.label.name == 'auto-add' || github.event.label.name == 'auto-remove'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });
            if (!['admin', 'maintain', 'write'].includes(data.permission)) {
              core.setFailed(`@${context.actor} cannot do ${context.payload.label.name} (no permissions)`);
              return;
            }
            const { data: user } = await github.rest.users.getByUsername({
              username: context.actor,
            });
            core.exportVariable('GIT_AUTHOR_NAME', user.name || user.login);
            core.exportVariable('GIT_AUTHOR_EMAIL', `${user.id}+${user.login}@users.noreply.github.com`);
      - run: |
          python -m pip install --upgrade pip
          python -m pip install .[update]
          git config user.name 'searxng-bot'
          git config user.email 'searxng-bot@users.noreply.github.com'
          before=$(git rev-parse HEAD)
          label='${{ github.event.label.name }}'
          python -m searxinstances.update --${label#auto-} "$ISSUE_TITLE" -m "Closes ${{ github.event.issue.html_url }}"
          test "$(git rev-parse HEAD)" != "$before"
          git push
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
      - if: success()
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const sha = (await exec.getExecOutput('git', ['rev-parse', 'HEAD'])).stdout.trim()
            const added = context.payload.label.name === 'auto-add'
            const verb = added ? 'Added' : 'Removed'
            const welcome = added ? ` Welcome to the public instances list @${context.payload.issue.user.login}!` : ''
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${verb} by @${context.actor} in ${context.payload.repository.html_url}/commit/${sha}.${welcome}`,
            })
            if (context.payload.issue.state !== 'closed') {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
              })
            }
      - if: failure()
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${context.payload.label.name} failed ([log](${context.payload.repository.html_url}/actions/runs/${context.runId})).`,
            })
      - if: always()
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: context.payload.label.name,
              })
            } catch (e) {
              if (e.status !== 404) throw e
            }
